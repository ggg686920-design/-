name: Reference archive integrity (not Android build)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate unchanged reference APK and static manifest
        run: python3 tools/inspect_apk.py artifacts/original/nasma-keyboard.apk --expected-sha256 b801b24a0694414830f47cfde3170a04672c361ab2ddcba2c70c1d0b5dd25895
