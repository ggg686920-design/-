name: Android IME runtime smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable disposable runner KVM access
        run: sudo chmod 666 /dev/kvm
      - name: Build app and isolated test APK
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Exercise the real IME on Android
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell ime list -s
            adb shell ime enable app.nasma.keyboard/.NasmaIme
            adb shell ime set app.nasma.keyboard/.NasmaIme
            bash ./gradlew --no-daemon :app:connectedDebugAndroidTest
            adb pull /sdcard/Android/data/app.nasma.keyboard/files/ app/build/runtime-screenshots/
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nasma-runtime-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/runtime-screenshots/
          retention-days: 7
